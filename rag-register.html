<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>解釈ノートを登録</title>
<style>body{margin:0;background:#f7f5ef;color:#26251f;font:16px system-ui,sans-serif}.box{max-width:560px;margin:12vh auto;padding:32px;background:#fff;border-radius:18px;box-shadow:0 8px 28px #2c271415}h1{font-size:24px}p{line-height:1.8}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;font:inherit}input{border:1px solid #b9b4a6;margin:10px 0}button{border:0;background:#685a33;color:#fff;cursor:pointer}button:disabled{opacity:.55}#result{min-height:1.5em;margin-top:18px}</style>
<main class="box"><h1>解釈ノートを参考資料に登録</h1><p>保存済みの「組み合わせ解釈ノート」を、AIが回答時に参照できるようにします。</p><label>登録用の合言葉<input id="token" type="password" autocomplete="off"></label><button id="submit" type="button">登録する</button><p id="result" aria-live="polite"></p></main>
<script>
const token=document.querySelector('#token'),button=document.querySelector('#submit'),result=document.querySelector('#result');
button.addEventListener('click',async()=>{button.disabled=true;result.textContent='登録しています…';try{const r=await fetch('/api/import-combination-note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value})});const data=await r.json();result.textContent=data.message||data.error||'登録できませんでした。';if(r.ok)token.value='';}catch{result.textContent='通信できませんでした。もう一度お試しください。';}finally{button.disabled=false;}});
</script>
